<div class="exp-form">
  <span class="sheet-grabber" aria-hidden="true"></span>

  <div class="form-head">
    <div class="form-head__icon"><mat-icon>edit</mat-icon></div>
    <div class="form-head__text">
      <h2>Edit Expense</h2>
      <p>Update the details below.</p>
    </div>
    <button
      mat-icon-button
      class="form-close"
      (click)="close()"
      aria-label="Close"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form [formGroup]="expensesForm" class="form-body">
    <mat-form-field appearance="outline" floatLabel="auto" class="w-100">
      <mat-label>Name</mat-label>
      <mat-icon matPrefix>label</mat-icon>
      <input matInput type="text" formControlName="expenseName" required />
      <mat-error *ngIf="nameControl.hasError('required')">
        Name is required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" floatLabel="auto" class="w-100">
      <mat-label>Amount</mat-label>
      <span matPrefix class="amount-prefix">₱</span>
      <input
        matInput
        type="number"
        formControlName="expenseAmount"
        required
        min="0"
        step="0.01"
      />
      <mat-error *ngIf="amountControl.hasError('required')">
        Amount is required
      </mat-error>
    </mat-form-field>

    <!-- Category — chip picker -->
    <div class="field-block">
      <span class="field-label">Category</span>
      <div class="cat-chips">
        <button
          type="button"
          class="cat-chip"
          *ngFor="let category of categories"
          [class.selected]="categoryControl.value === category"
          (click)="selectCategory(category)"
        >
          <mat-icon>{{ categoryIcon(category) }}</mat-icon>
          <span>{{ categoryLabel(category) }}</span>
        </button>
      </div>
    </div>

    <div class="field-block">
      <span class="field-label">Date</span>
      <component-date-picker formControlName="expenseDate"></component-date-picker>
    </div>

    <div class="field-block">
      <span class="field-label">Time</span>
      <component-time-picker formControlName="expenseTime"></component-time-picker>
    </div>

    <mat-form-field appearance="outline" floatLabel="auto" class="w-100">
      <mat-label>Description</mat-label>
      <mat-icon matPrefix>notes</mat-icon>
      <textarea
        matInput
        rows="2"
        placeholder="Optional note…"
        formControlName="expenseDescription"
      ></textarea>
    </mat-form-field>
  </form>

  <div class="form-actions">
    <button type="button" class="act act-ghost" (click)="close()">
      Cancel
    </button>
    <button
      type="button"
      class="act act-primary"
      (click)="updateExpense()"
      [disabled]="expensesForm.invalid"
    >
      <mat-icon>save</mat-icon>
      Save Changes
    </button>
  </div>
</div>
