<ng-container *ngIf="vm$ | async as vm">
  <div id="inventory-summary" class="inventory-summary-container mt-2 mb-3">
    <div class="inventory-summary-cards">
      <mat-card class="summary-card">
        <mat-card-header>
          <mat-card-title>
            {{ vm.filteredCount }}
          </mat-card-title>
          <mat-card-subtitle>Total Items</mat-card-subtitle>
        </mat-card-header>
      </mat-card>
    </div>
  </div>

  <div class="search-container">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search...</mat-label>
      <input
        #searchInput
        matInput
        placeholder="Search"
        (input)="onSearch($event)"
      />
    </mat-form-field>
  </div>

  <div class="results-info mb-2" *ngIf="vm.filteredCount !== vm.totalCount">
    <small class="text-light">
      Showing {{ vm.filteredCount }} of {{ vm.totalCount }} items
    </small>
  </div>

  <div class="inventory-list">
    <mat-list role="listbox">
      <mat-list-item
        role="listitem"
        class="inventory-row"
        *ngFor="let item of vm.inventoryItems"
        (click)="onItemClick(item)"
      >
        <mat-icon matListItemIcon class="inventory-icon">inventory_2</mat-icon>
        <span matListItemTitle class="inventory-name">{{ item.name }}</span>
        <span matListItemLine class="inventory-store" *ngIf="item.store">{{
          item.store
        }}</span>
        <span matListItemMeta class="inventory-price">{{
          item.price | currency : "PHP" : "symbol" : "1.2-2"
        }}</span>
      </mat-list-item>
    </mat-list>

    <div class="empty-list" *ngIf="vm.inventoryItems && vm.inventoryItems.length === 0">
      <mat-icon>inventory_2</mat-icon>
      <p>No inventory items to show.</p>
    </div>
  </div>
</ng-container>
