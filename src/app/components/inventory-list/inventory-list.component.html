<ng-container *ngIf="vm$ | async as vm">
  <div id="inventory-summary" class="inventory-summary-container mt-2 mb-3">
    <div class="inventory-summary-cards">
      <mat-card class="summary-card">
        <mat-card-header>
          <mat-card-title>
            {{ vm.filteredCount }}
          </mat-card-title>
          <mat-card-subtitle>Total Items</mat-card-subtitle>
        </mat-card-header>
      </mat-card>
    </div>
  </div>

  <div class="search-container">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search...</mat-label>
      <input
        #searchInput
        matInput
        placeholder="Search"
        (input)="onSearch($event)"
      />
    </mat-form-field>
  </div>

  <div class="results-info mb-2" *ngIf="vm.filteredCount !== vm.totalCount">
    <small class="text-light">
      Showing {{ vm.filteredCount }} of {{ vm.totalCount }} items
    </small>
  </div>

  <div class="inventory-list" role="list">
    <!-- Swipe a row to the right to delete it (a confirmation is shown). -->
    <div
      class="swipe-cell"
      *ngFor="let item of vm.inventoryItems; trackBy: trackById"
    >
      <div class="swipe-cell__bg" [class.armed]="sw.armed" aria-hidden="true">
        <mat-icon>delete</mat-icon>
        <span>Delete</span>
      </div>

      <div
        class="swipe-fg inventory-row"
        appSwipeToDelete
        #sw="swipeToDelete"
        role="listitem"
        tabindex="0"
        (tap)="onItemClick(item)"
        (swipeDelete)="confirmDelete(item)"
        (keydown.enter)="onItemClick(item)"
      >
        <div class="inventory-icon-wrap">
          <mat-icon class="inventory-icon">inventory_2</mat-icon>
        </div>
        <div class="inventory-text">
          <span class="inventory-name">{{ item.name }}</span>
          <span class="inventory-store" *ngIf="item.store">{{ item.store }}</span>
        </div>
        <span class="inventory-price">{{
          item.price | currency : "PHP" : "symbol" : "1.2-2"
        }}</span>
      </div>
    </div>

    <div class="empty-list" *ngIf="vm.inventoryItems && vm.inventoryItems.length === 0">
      <mat-icon>inventory_2</mat-icon>
      <p>No inventory items to show.</p>
    </div>
  </div>
</ng-container>
