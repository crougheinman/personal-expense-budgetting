<ng-container  *ngIf="vm$ | async as vm;">
  <div class="sign-in">
    <div class="d-flex justify-content-center">
      <div class="auth-card text-center mt-5 pt-5">
        <h2>{{ mode === 'register' ? 'Create account' : 'Sign In' }}</h2>

        <form [formGroup]="authform" (ngSubmit)="onSubmit()" class="auth-form">
          <label class="auth-field">
            <span class="auth-field__label">Email</span>
            <input
              type="email"
              formControlName="email"
              autocomplete="email"
              placeholder="you@example.com"
            />
          </label>

          <label class="auth-field">
            <span class="auth-field__label">Password</span>
            <input
              type="password"
              formControlName="password"
              [attr.autocomplete]="mode === 'register' ? 'new-password' : 'current-password'"
              placeholder="At least 6 characters"
            />
          </label>

          <label class="auth-field" *ngIf="mode === 'register'">
            <span class="auth-field__label">Confirm password</span>
            <input
              type="password"
              formControlName="confirmPassword"
              autocomplete="new-password"
              placeholder="Re-enter password"
            />
          </label>

          <div
            id="recaptcha-container"
            class="auth-recaptcha"
            *ngIf="mode === 'register'"
          ></div>

          <button type="submit" class="auth-submit" [disabled]="vm.isLoading">
            {{
              vm.isLoading
                ? 'Please wait…'
                : (mode === 'register' ? 'Create account' : 'Sign in')
            }}
          </button>
        </form>

        <p class="auth-toggle">
          {{ mode === 'register' ? 'Already have an account?' : "Don't have an account?" }}
          <button type="button" class="auth-link" (click)="toggleMode()">
            {{ mode === 'register' ? 'Sign in' : 'Create one' }}
          </button>
        </p>

        <div class="auth-divider"><span>or</span></div>

        <button matButton="filled" color="primary d-block mb-2 mx-auto" (click)="onSignInWithGoogle()">
          <span class="google-icon" style="vertical-align: middle">
            <svg width="20" height="20" viewBox="0 0 48 48">
              <g>
                <path
                  fill="#4285F4"
                  d="M43.6 20.5h-1.9V20H24v8h11.3c-1.6 4.3-5.7 7-11.3 7-6.6 0-12-5.4-12-12s5.4-12 12-12c2.8 0 5.4 1 7.5 2.7l6.2-6.2C34.5 5.5 29.5 3.5 24 3.5 12.4 3.5 3 12.9 3 24.5S12.4 45.5 24 45.5c11.1 0 20.5-9 20.5-20.5 0-1.4-.1-2.7-.3-4z"
                />
                <path
                  fill="#34A853"
                  d="M6.3 14.1l6.6 4.8C14.5 16.1 18.9 13.5 24 13.5c2.8 0 5.4 1 7.5 2.7l6.2-6.2C34.5 5.5 29.5 3.5 24 3.5c-7.2 0-13.4 4.1-16.7 10.6z"
                />
                <path
                  fill="#FBBC05"
                  d="M24 45.5c5.5 0 10.5-1.8 14.4-4.9l-6.7-5.5c-2 1.4-4.5 2.2-7.7 2.2-5.6 0-10.3-3.8-12-9H6.3v5.7C9.6 41.4 16.2 45.5 24 45.5z"
                />
                <path
                  fill="#EA4335"
                  d="M43.6 20.5h-1.9V20H24v8h11.3c-0.7 2-2.1 3.7-4.1 4.9l6.7 5.5c3.9-3.6 6.1-8.9 6.1-14.9 0-1.4-.1-2.7-.3-4z"
                />
              </g>
            </svg>
          </span>
          Sign in with Google
        </button>

        <p class="auth-error" *ngIf="vm.errorMessage">
          {{ vm.errorMessage }}
        </p>
      </div>
    </div>
  </div>
</ng-container>
