<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PEB</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- Apply the saved/system theme before first paint to avoid a flash. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('peb.theme');
        if (t !== 'light' && t !== 'dark') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        var r = document.documentElement;
        r.setAttribute('data-bs-theme', t);
        r.style.colorScheme = t;
      } catch (e) {
        document.documentElement.setAttribute('data-bs-theme', 'light');
      }
    })();
  </script>
  <style>
    html[data-bs-theme="dark"], html[data-bs-theme="dark"] body { background-color: #121017; }
    html[data-bs-theme="light"], html[data-bs-theme="light"] body { background-color: #f5f4fa; }
  </style>
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
